report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/newrnaseq/tree/dev" target="_blank">nf-core/newrnaseq</a>
  analysis pipeline. For information about how to interpret these results, please see the
  <a href="https://nf-co.re/newrnaseq/dev/docs/output" target="_blank">documentation</a>.
report_section_order:
  "nf-core-newrnaseq-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "nf-core-newrnaseq-summary":
    order: -1002

export_plots: true

disable_version_detection: true

module_order:
  - fastqc:
      name: "FastQC (raw)"
      info: "FastQC before trimming"
      path_filters:
        - "*_raw_fastqc.zip"
  - fastp
  - fastqc:
      name: "FastQC (trimmed)"
      info: "FastQC after trimming with fastp"
      path_filters:
        - "*_trimmed_fastqc.zip"
  - star
  - salmon
  - picard
  - custom_content

custom_data:
  gene_raw_pca:
    section_name: "PCA: log-transformed gene counts"
    description: "PCA of log2(gene counts + 1). Each dot is one sample. Axis labels show the variance explained by each component."
  gene_tpm_pca:
    section_name: "PCA: TPM-normalized gene counts"
    description: "PCA of gene TPM. Each dot is one sample. Axis labels show the variance explained by each component."

custom_content:
  order:
    - gene_raw_pca
    - gene_tpm_pca